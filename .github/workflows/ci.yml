name: CI

# Nothing here writes to the repository, and the default token is granted write scopes it would
# hand to any workflow step -- including a compromised dependency's postinstall script.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the engines floor in package.json.
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
